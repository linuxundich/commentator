# Robolectric bringt keine Laufzeit für jede API-Ebene mit. Getestet wird
# gegen eine Ebene, für die es eine gibt; die App selbst wird gegen API 37
# übersetzt.
sdk=34

# Ohne nativen Grafikmodus misst Robolectric Text mit der Größe 0. Compose
# legt dann alles übereinander und nichts gilt als sichtbar - die
# Oberflächentests wären wertlos.
graphicsMode=NATIVE
