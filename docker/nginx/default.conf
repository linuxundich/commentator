# TLS-Abschluss vor WordPress.
#
# Die App lässt ausschließlich HTTPS zu, deshalb ist dieser Proxy auch in der
# Testumgebung nicht optional.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    location / {
        proxy_pass http://wordpress:80;
        # $http_host statt $host:$server_port: Letzteres ergibt den Port
        # innerhalb des Containers (443) und nicht den nach aussen
        # veroeffentlichten (8443). WordPress verglich das mit seiner
        # hinterlegten Adresse und leitete die Startseite im Kreis um. Der
        # REST-API fiel das nie auf, sie kennt keine kanonische Umleitung.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
    }
}
